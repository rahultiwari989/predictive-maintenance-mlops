apiVersion: apps/v1
kind: Deployment

metadata:
  name: predictive-maintenance-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: predictive-maintenance-api

  template:
    metadata:
      labels:
        app: predictive-maintenance-api

    spec:
      containers:

        - name: api

          image: predictive-maintenance-api:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 10