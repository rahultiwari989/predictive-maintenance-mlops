name: Predictive Maintenance CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    name: Test ML Project

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      - name: Run unit tests
        run: |
          python -m pytest -v


  docker:

    name: Build Docker Images

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build API image
        run: |
          docker build \
            -t predictive-maintenance-api:${{ github.sha }} \
            .


      - name: Build Dashboard image
        run: |
          docker build \
            -f Dockerfile.dashboard \
            -t predictive-maintenance-dashboard:${{ github.sha }} \
            .