name: Predictive Maintenance CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  PROJECT_ID: pm-mlops-gcp-2026
  REGION: asia-south1
  REPOSITORY: predictive-maintenance

  API_IMAGE: predictive-maintenance-api
  DASHBOARD_IMAGE: predictive-maintenance-dashboard

  GKE_CLUSTER: predictive-maintenance


jobs:

  # ============================================================
  # CI
  # ============================================================

  test:

    name: Run Unit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      - name: Run unit tests
        run: |
          python -m pytest -v


  # ============================================================
  # BUILD + PUSH
  # ============================================================

  build-and-push:

    name: Build and Push Docker Images

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Authenticate to Google Cloud
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}


      # ----------------------------------------------------------
      # Setup gcloud
      # ----------------------------------------------------------

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2


      # ----------------------------------------------------------
      # Configure Docker
      # ----------------------------------------------------------

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet


      # ----------------------------------------------------------
      # Build API
      # ----------------------------------------------------------

      - name: Build API image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$API_IMAGE:${{ github.sha }} \
            .


      # ----------------------------------------------------------
      # Build Dashboard
      # ----------------------------------------------------------

      - name: Build Dashboard image
        run: |
          docker build \
            -f Dockerfile.dashboard \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$DASHBOARD_IMAGE:${{ github.sha }} \
            .


      # ----------------------------------------------------------
      # Push API
      # ----------------------------------------------------------

      - name: Push API image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$API_IMAGE:${{ github.sha }}


      # ----------------------------------------------------------
      # Push Dashboard
      # ----------------------------------------------------------

      - name: Push Dashboard image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$DASHBOARD_IMAGE:${{ github.sha }}


  # ============================================================
  # CD
  # ============================================================

  deploy:

    name: Deploy to GKE

    needs: build-and-push

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Authenticate
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}


      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2


      # ----------------------------------------------------------
      # Connect to GKE
      # ----------------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}


      # ----------------------------------------------------------
      # Deploy API
      # ----------------------------------------------------------

      - name: Deploy API
        run: |
          kubectl set image deployment/predictive-maintenance-api \
            api=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$API_IMAGE:${{ github.sha }}


      # ----------------------------------------------------------
      # Deploy Dashboard
      # ----------------------------------------------------------

      - name: Deploy Dashboard
        run: |
          kubectl set image deployment/predictive-maintenance-dashboard \
            dashboard=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$DASHBOARD_IMAGE:${{ github.sha }}


      # ----------------------------------------------------------
      # Verify API rollout
      # ----------------------------------------------------------

      - name: Wait for API rollout
        run: |
          kubectl rollout status \
            deployment/predictive-maintenance-api \
            --timeout=10m


      # ----------------------------------------------------------
      # Verify Dashboard rollout
      # ----------------------------------------------------------

      - name: Wait for Dashboard rollout
        run: |
          kubectl rollout status \
            deployment/predictive-maintenance-dashboard \
            --timeout=10m


      # ----------------------------------------------------------
      # Final verification
      # ----------------------------------------------------------

      - name: Verify Kubernetes deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services